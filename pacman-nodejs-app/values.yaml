agent:
  discovery:
    enabled: true

clusterName: AYPAC_Cluster
environment: AYPAC_ENV

gateway:
  enabled: false

operator:
  enabled: true
operatorcrds:
  install: true

clusterReceiver:
  enabled: true
  config:
    receivers:
      mongodb:
        hosts:
          - endpoint: "mongo.mongo.svc.cluster.local:27017"
        collection_interval: 60s
        initial_delay: 1s
        tls:
          insecure: true
          insecure_skip_verify: true
        direct_connection: true

      prometheus/pacmandb:
        config:
          scrape_configs:
            - job_name: 'pacman-mongo-exporter'
              scrape_interval: 30s
              static_configs:
                - targets: ['pacman-mongo-exporter.default.svc.cluster.local:3000']
    processors:
      resource/add_mongo_name:
        attributes:
          - key: "mongodb.instance.name"
            value: "AYPAC_MONGO"
            action: insert
    service:
      pipelines:
        metrics/mongodb:
          receivers: [mongodb]
          processors: [resource/add_mongo_name]
          exporters: [signalfx]

        metrics/mongoexporter:
          receivers: [prometheus/pacmandb]
          processors: [resource/add_mongo_name]
          exporters: [signalfx]

splunkObservability:
  accessToken: Fkp-hKzmQnqn-9VgiU1G7w
  realm: us1

splunkPlatform:
  token: 65b7c776-1544-4547-bcb4-33d9e24953ae
